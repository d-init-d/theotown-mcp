[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "theotown-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for TheoTown city simulation"
readme = { text = "# TheoTown MCP Server\nModel Context Protocol (MCP) server for TheoTown city simulation", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "d-init-d" }
]
keywords = ["theotown", "mcp", "model-context-protocol", "simulation", "city-builder", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
theotown-mcp = "theotown_mcp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/theotown_mcp"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
